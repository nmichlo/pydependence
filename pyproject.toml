# ========================================================================= #
# RUFF                                                                      #
# ========================================================================= #

[tool.ruff]
line-length = 120
target-version = "py312"
# these are AST fixtures: fake modules with imports to non-existent packages, parsed
# only via `ast.parse` and never executed. exact bytes (imports, blank lines) are the
# test data -- lint/format would "fix" them into something the tests no longer match.
# `force-exclude` is required so this also applies when pre-commit passes these files
# in explicitly (it only passes changed files, not whole directories).
extend-exclude = ["tests/test-packages"]
force-exclude = true

[tool.ruff.lint]
# `E4/E7/E9 + F` is the ruff default, `I` adds import sorting (previously isort).
# `UP` modernises syntax for the python floor, including PEP 695 generics.
# `TID251` enforces the banned-api list below.
# `B009`/`B010` ban `getattr(x, "const")` / `setattr(x, "const", v)` -- write `x.const`.
select = ["E4", "E7", "E9", "F", "I", "UP", "TID251", "B009", "B010"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any disables type checking wherever it appears. Use a precise type, a TypeVar, a Protocol, or a dedicated sentinel class."
"typing.cast".msg = "cast asserts a type the checker cannot verify. Narrow with isinstance/assert, or fix the annotation."

[tool.ruff.lint.isort]
# previously `isort --profile=black --force-single-line-imports`
force-single-line = true

[tool.ruff.lint.per-file-ignores]
# `__init__.py` files are re-export hubs -- unsorted and "unused" imports are the point.
"**/__init__.py" = ["F401", "I001"]



# ========================================================================= #
# TY                                                                        #
# ========================================================================= #

# ty runs as a pre-commit hook and gates CI. it needs the dependencies resolvable
# and auto-detects `.venv`, so create one first:
#     uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[test]"
#     uvx ty check

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# AST fixtures with imports to non-existent packages -- never meant to type-check,
# only to be parsed via `ast.parse` by the import-parser tests.
exclude = ["tests/test-packages"]
